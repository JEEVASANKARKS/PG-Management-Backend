spring.application.name=pg-management-backend

# Server configuration
server.port=8080

# Dummy MySQL datasource configuration.
# Replace the username and password with your local MySQL credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/pg_management
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
