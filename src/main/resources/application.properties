spring.application.name=pg-management-backend

# Server configuration
server.port=8080

# Default JPA datasource used by the admin lookup repository
spring.datasource.url=jdbc:mysql://localhost:3306/pg_config_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none

# --- Operational Database (Heavy Usage) ---
spring.operational.datasource.url=jdbc:mysql://localhost:3306/pg_operational_db
spring.operational.datasource.username=root
spring.operational.datasource.password=root
spring.operational.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration Database (Low Usage / Internal) ---
spring.config.datasource.url=jdbc:mysql://localhost:3306/pg_config_db
spring.config.datasource.username=root
spring.config.datasource.password=root
spring.config.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
